name: Build huggingface Image



# 触发条件：当向 main 分支推送代码，或者手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 定义镜像名称（自动转换为小写，避免命名空间大小写报错）
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 授予工作流必要的权限（必须，否则无法推送镜像到仓库）
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录到 GitHub Container Registry (GHCR)
      # 这里的 GITHUB_TOKEN 是 GitHub 自动生成的，不需要你手动配置 Secret
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 提取 Docker 元数据（自动生成标签，如 :latest 和 :sha-xxxx）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 4. 设置 Docker Buildx（支持更高级的缓存和多架构构建）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启缓存，极大地加快后续的构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
